<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rede CAPES Global - Painel de Controle</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
:root{
  --navy:#0f2a4a; --navy-2:#15375f; --blue:#2563a8; --blue-light:#eaf1f9;
  --border:#e2e8f0; --text:#1c2b3a; --muted:#64748b; --bg:#f4f6f9;
  --good:#2f8f6e; --warn:#c98a2a; --bad:#c85a3e; --grey:#94a3b8; --card:#ffffff;
  --sidebar-w:250px;
  --bar-bg:#0a1e3d; --bar-bg-2:#0f2a52; --bar-text:#ffffff; --bar-text-muted:#a9c6e8; --bar-border:rgba(255,255,255,0.14);
  --network-pattern: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22200%22%20height%3D%22200%22%20viewBox%3D%220%200%20200%20200%22%3E%0A%3Cdefs%3E%0A%20%20%3CradialGradient%20id%3D%22glow%22%20cx%3D%2250%25%22%20cy%3D%2250%25%22%20r%3D%2250%25%22%3E%0A%20%20%20%20%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%237dd3fc%22%20stop-opacity%3D%220.9%22/%3E%0A%20%20%20%20%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%237dd3fc%22%20stop-opacity%3D%220%22/%3E%0A%20%20%3C/radialGradient%3E%0A%3C/defs%3E%0A%3Cg%20fill%3D%22none%22%20stroke%3D%22%233b82f6%22%20stroke-width%3D%220.8%22%20opacity%3D%220.35%22%3E%0A%20%20%3Cpolygon%20points%3D%2230%2C10%2050%2C22%2050%2C46%2030%2C58%2010%2C46%2010%2C22%22/%3E%0A%20%20%3Cpolygon%20points%3D%22140%2C60%20162%2C73%20162%2C99%20140%2C112%20118%2C99%20118%2C73%22/%3E%0A%20%20%3Cpolygon%20points%3D%2270%2C130%2092%2C143%2092%2C169%2070%2C182%2048%2C169%2048%2C143%22/%3E%0A%3C/g%3E%0A%3Cg%20stroke%3D%22%2360a5fa%22%20stroke-width%3D%220.7%22%20opacity%3D%220.4%22%3E%0A%20%20%3Cline%20x1%3D%2230%22%20y1%3D%2258%22%20x2%3D%2270%22%20y2%3D%22130%22/%3E%0A%20%20%3Cline%20x1%3D%2250%22%20y1%3D%2246%22%20x2%3D%22118%22%20y2%3D%2273%22/%3E%0A%20%20%3Cline%20x1%3D%2292%22%20y1%3D%22143%22%20x2%3D%22140%22%20y2%3D%22112%22/%3E%0A%20%20%3Cline%20x1%3D%2210%22%20y1%3D%2222%22%20x2%3D%220%22%20y2%3D%220%22/%3E%0A%20%20%3Cline%20x1%3D%22162%22%20y1%3D%2273%22%20x2%3D%22200%22%20y2%3D%2255%22/%3E%0A%20%20%3Cline%20x1%3D%2248%22%20y1%3D%22169%22%20x2%3D%2220%22%20y2%3D%22200%22/%3E%0A%20%20%3Cline%20x1%3D%22140%22%20y1%3D%22112%22%20x2%3D%22180%22%20y2%3D%22140%22/%3E%0A%3C/g%3E%0A%3Cg%3E%0A%20%20%3Ccircle%20cx%3D%2230%22%20cy%3D%2234%22%20r%3D%2210%22%20fill%3D%22url%28%23glow%29%22/%3E%0A%20%20%3Ccircle%20cx%3D%2230%22%20cy%3D%2234%22%20r%3D%222.4%22%20fill%3D%22%23e0f2fe%22/%3E%0A%20%20%3Ccircle%20cx%3D%22140%22%20cy%3D%2286%22%20r%3D%228%22%20fill%3D%22url%28%23glow%29%22/%3E%0A%20%20%3Ccircle%20cx%3D%22140%22%20cy%3D%2286%22%20r%3D%222%22%20fill%3D%22%23e0f2fe%22/%3E%0A%20%20%3Ccircle%20cx%3D%2270%22%20cy%3D%22156%22%20r%3D%229%22%20fill%3D%22url%28%23glow%29%22/%3E%0A%20%20%3Ccircle%20cx%3D%2270%22%20cy%3D%22156%22%20r%3D%222.2%22%20fill%3D%22%23e0f2fe%22/%3E%0A%20%20%3Ccircle%20cx%3D%220%22%20cy%3D%220%22%20r%3D%221.6%22%20fill%3D%22%2393c5fd%22/%3E%0A%20%20%3Ccircle%20cx%3D%22200%22%20cy%3D%2255%22%20r%3D%221.6%22%20fill%3D%22%2393c5fd%22/%3E%0A%20%20%3Ccircle%20cx%3D%2220%22%20cy%3D%22200%22%20r%3D%221.6%22%20fill%3D%22%2393c5fd%22/%3E%0A%20%20%3Ccircle%20cx%3D%22180%22%20cy%3D%22140%22%20r%3D%221.6%22%20fill%3D%22%2393c5fd%22/%3E%0A%20%20%3Ccircle%20cx%3D%22118%22%20cy%3D%2273%22%20r%3D%221.8%22%20fill%3D%22%23bfdbfe%22/%3E%0A%20%20%3Ccircle%20cx%3D%2292%22%20cy%3D%22143%22%20r%3D%221.8%22%20fill%3D%22%23bfdbfe%22/%3E%0A%3C/g%3E%0A%3C/svg%3E");
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}

/* ---------- SIDEBAR ---------- */
#sidebar{
  position:fixed; top:0; left:0; bottom:0; width:var(--sidebar-w);
  background:linear-gradient(180deg,#123a6e 0%,#0d2b52 45%,#0a1e3d 100%);
  border-right:1px solid var(--bar-border);
  display:flex; flex-direction:column; z-index:10;
}
#sidebar::after{ /* halftone de pontos no rodapé */
  content:''; position:absolute; left:0; right:0; bottom:0; height:220px; pointer-events:none;
  background-image: radial-gradient(rgba(96,165,250,.4) 1.3px, transparent 1.4px);
  background-size: 13px 13px;
  -webkit-mask-image: radial-gradient(circle at 15% 100%, #000 0%, transparent 62%);
          mask-image: radial-gradient(circle at 15% 100%, #000 0%, transparent 62%);
}
.brand{ padding:16px 16px 14px; flex-shrink:0; position:relative; z-index:1; }
.brand-logo-chip{ background:#fff; border-radius:14px; padding:10px 16px; display:block; box-shadow:0 4px 16px rgba(0,0,0,.28); }
.brand img{ max-width:100%; height:auto; display:block; }
.brand-sub{ font-size:10.5px; color:var(--bar-text-muted); font-weight:500; margin-top:8px; letter-spacing:.02em; padding-left:2px; }

nav{ padding:16px 14px 14px 30px; flex:1; overflow-y:auto; position:relative; z-index:1; }
#navRail{ position:absolute; left:17px; width:1.5px;
  background:linear-gradient(180deg, rgba(96,165,250,.7), rgba(96,165,250,.25));
  border-radius:2px; z-index:0;
}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 14px; border-radius:999px;
  font-size:13.5px; font-weight:500; color:var(--bar-text); cursor:pointer; margin-bottom:5px;
  transition:background .12s; position:relative;
}
.nav-item.lvl0::before{ /* ponto no trilho */
  content:''; position:absolute; left:-16.5px; top:50%; transform:translate(-50%,-50%);
  width:7px; height:7px; border-radius:50%; background:#60a5fa;
  box-shadow:0 0 6px rgba(96,165,250,.8);
}
.nav-item:hover{ background:rgba(255,255,255,0.10); }
.nav-item.active{
  background:linear-gradient(90deg,#1d6ff2,#2f86ff); color:#fff;
  box-shadow:0 4px 14px rgba(29,111,242,.45);
}
.nav-item .ic{ width:17px; height:17px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; }
.nav-item .ic svg{ width:16px; height:16px; display:block; }
.nav-item .chev{ margin-left:auto; font-size:10px; transition:transform .15s; opacity:.7; }
.nav-item.expanded .chev{ transform:rotate(90deg); }
.submenu{ max-height:0; overflow:hidden; transition:max-height .18s ease; padding-left:16px; }
.submenu.open{ max-height:400px; }
.submenu .nav-item{ font-size:12.5px; font-weight:400; padding:7px 14px; }

.sidebar-circuit{ flex-shrink:0; height:64px; position:relative; z-index:1; pointer-events:none; margin-top:-6px; }
.sidebar-footer{ flex-shrink:0; border-top:1px solid var(--bar-border); padding:10px 0; background:rgba(0,0,0,0.22); position:relative; z-index:1; }
.sidebar-footer img{ width:100%; height:auto; display:block; opacity:.95; }
.sidebar-footer .caption{ font-size:9px; color:var(--bar-text-muted); text-align:center; text-transform:uppercase; letter-spacing:.06em; padding:4px 0 2px; font-weight:600; }

/* ---------- MAIN ---------- */
#main{ margin-left:var(--sidebar-w); min-height:100vh; }
.topbar{
  background:linear-gradient(90deg,#0d2b52 0%,#123a6e 60%,#0f3060 100%);
  border-bottom:1px solid var(--bar-border); padding:22px 36px 20px;
  display:flex; justify-content:space-between; align-items:flex-start;
  position:relative; overflow:hidden;
}
.topbar::after{ /* halftone de pontos à direita */
  content:''; position:absolute; top:0; right:0; bottom:0; width:420px; pointer-events:none;
  background-image: radial-gradient(rgba(96,165,250,.4) 1.3px, transparent 1.4px);
  background-size: 13px 13px;
  -webkit-mask-image: radial-gradient(circle at 100% 0%, #000 0%, transparent 65%);
          mask-image: radial-gradient(circle at 100% 0%, #000 0%, transparent 65%);
}
.topbar h1{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; color:#fff; position:relative; z-index:1; }
.topbar p{ font-size:13px; color:var(--bar-text-muted); margin-top:4px; position:relative; z-index:1; }
.content{ padding:26px 36px 60px; }

/* KPI cards */
.kpi-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; margin-bottom:26px; }
.kpi{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 16px 14px; }
.kpi .label{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; margin-bottom:8px; }
.kpi .value{ font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:700; color:var(--navy); }
.kpi .value.status{ font-size:13px; padding:3px 10px; border-radius:20px; display:inline-block; }
.status-nao{ background:#fdf1e4; color:var(--warn); }
.status-and{ background:#e6f0fb; color:var(--blue); }
.status-con{ background:#e6f4ee; color:var(--good); }
.status-futuro{ background:#f1f3f6; color:var(--grey); }

.section-title{
  font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; color:var(--navy);
  margin:28px 0 14px; display:flex; align-items:center; gap:8px;
}
.section-title .tag{ font-size:10.5px; font-weight:600; color:var(--blue); background:var(--blue-light); padding:2px 8px; border-radius:20px; }

/* Year / entity cards */
.entity-card{
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:18px 22px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:20px;
}
.entity-card .left{ min-width:120px; }
.entity-card .left .name{ font-family:'Space Grotesk'; font-size:17px; font-weight:700; color:var(--navy); }
.entity-card .left .status{ font-size:10px; text-transform:uppercase; letter-spacing:.04em; font-weight:600; margin-top:4px; padding:2px 8px; border-radius:20px; display:inline-block; }
.entity-card .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:22px; flex:1; }
.entity-card .stat{ text-align:center; }
.entity-card .stat .k{ font-size:10px; text-transform:uppercase; color:var(--muted); font-weight:600; letter-spacing:.03em; }
.entity-card .stat .v{ font-size:13px; font-weight:600; color:var(--text); margin-top:2px; }

/* Grid layouts */
.grid-2{ display:grid; grid-template-columns:1.3fr 1fr; gap:18px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.panel{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px 22px; }
.panel h3{ font-size:13.5px; font-weight:600; color:var(--text); margin-bottom:14px; }
.fl-arc-dash{ stroke-dasharray:5 8; animation:flDash 1.8s linear infinite; }
@keyframes flDash{ to{ stroke-dashoffset:-26; } }
@media (prefers-reduced-motion:reduce){ .fl-arc-dash{ animation:none; } }
@media (max-width:700px){ #flBox{ height:300px !important; } }
.chart-box{ position:relative; height:260px; }
.chart-box.sm{ height:200px; }

table{ width:100%; border-collapse:collapse; font-size:12.5px; }
th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border); }
th.num{ text-align:right; }
td{ padding:9px 10px; border-bottom:1px solid #eef1f5; color:var(--text); }
tr:last-child td{ border-bottom:none; }
td.num{ text-align:right; font-variant-numeric:tabular-nums; }
.pct-pill{ display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; }

.empty-state{ text-align:center; padding:30px 20px; color:var(--muted); font-size:12.5px; }

/* Quem Somos - estrutura da rede */
.qs-card{ border-radius:10px; padding:12px 14px; font-size:12.5px; border:1.5px solid transparent; }
.qs-list{ list-style:none; margin-top:8px; padding:0; }
.qs-list li{ font-size:11.5px; padding:4px 0; border-bottom:1px dashed rgba(0,0,0,.06); }
.qs-list li:last-child{ border-bottom:none; }
.qs-tiny{ font-size:10.5px; color:var(--muted); margin-top:3px; }
.qs-hr{ border:none; border-top:1px dashed rgba(0,0,0,.1); margin:6px 0; }
.qs-pill{ font-size:10px; font-weight:600; padding:3px 9px; border-radius:20px; }
.qs-green{ background:#eaf6f0; border-color:#bfe3cd; color:#1e6b45; }
.qs-blue{ background:#eaf1fb; border-color:#c3d9f5; color:#0f2a4a; }
.qs-blue-pill{ background:#dceafb; color:#1a4d8f; }
.qs-orange{ background:#fdf3e7; border-color:#f3d9ad; color:#8a5a13; }
.qs-purple{ background:#f3ecfb; border-color:#dcc7f2; color:#5b2e82; }
.qs-hub{ background:linear-gradient(160deg,#0a1e3d,#123a6e); border-color:#123a6e; color:#fff; padding:20px 14px; }

/* Quem Somos - cards assimetrias/objetivo */
.qs-duo{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.qs-duo-card{ position:relative; overflow:hidden; border-radius:12px; border:1px solid var(--border); background:linear-gradient(155deg,#ffffff 0%,#f2f7fd 60%,#e8f1fb 100%); min-height:230px; }
.qs-duo-bg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.qs-duo-content{ position:relative; z-index:1; padding:26px 28px; }
@media (max-width:900px){ .qs-duo{ grid-template-columns:1fr; } }

.page{ display:none; }
.page.active{ display:block; }

@media (max-width:1100px){
  .kpi-row{ grid-template-columns:repeat(2,1fr); }
  .grid-2,.grid-3{ grid-template-columns:1fr; }
  .entity-card .stats{ grid-template-columns:repeat(2,1fr); }
}

/* ---------- RESPONSIVO (celular / tablet) ---------- */
#menuToggle{
  display:none; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25);
  border-radius:10px; width:40px; height:40px; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0; margin-right:14px; position:relative; z-index:2; padding:0;
}
#menuToggle svg{ width:20px; height:20px; stroke:#fff; }
#backdrop{ display:none; position:fixed; inset:0; background:rgba(6,16,32,.55); z-index:9; }
#backdrop.show{ display:block; }

@media (max-width:900px){
  #sidebar{ transform:translateX(-105%); transition:transform .25s ease; width:min(280px, 82vw); box-shadow:none; }
  #sidebar.open{ transform:translateX(0); box-shadow:0 0 40px rgba(0,0,0,.5); }
  #main{ margin-left:0; }
  #menuToggle{ display:flex; }
  .topbar{ padding:14px 16px; align-items:center; }
  .topbar h1{ font-size:18px; }
  .topbar p{ font-size:11.5px; }
  .content{ padding:16px 14px 50px; }
  .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; }
  .kpi .value{ font-size:15px; }
  .panel{ padding:14px 14px; overflow-x:auto; }
  .entity-card{ flex-direction:column; align-items:flex-start; gap:12px; padding:14px 16px; }
  .entity-card .stats{ width:100%; grid-template-columns:repeat(2,1fr); gap:12px; }
  .qs-duo{ grid-template-columns:1fr; }
  .qs-duo-content{ padding:20px 20px; }
  .content svg[viewBox="0 0 780 680"]{ min-width:100% !important; flex:none !important; }
  .chart-box{ height:220px; }
}
@media (max-width:480px){
  .kpi-row{ grid-template-columns:1fr; }
  .entity-card .stats{ grid-template-columns:1fr 1fr; }
}
</style>
</head>
<body>

<div id="sidebar">
  <div class="brand">
    <div class="brand-logo-chip"><img src="logo-capes-global.png" alt="Rede CAPES Global"></div>
    <div class="brand-sub">Painel de Controle</div>
  </div>
  <nav id="navRoot"></nav>
  <svg class="sidebar-circuit" viewBox="0 0 250 64" preserveAspectRatio="none">
    <path d="M17,0 L17,20 L48,42 L48,64" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity=".8"/>
    <path d="M48,52 L120,52 L150,34 L210,34" fill="none" stroke="#60a5fa" stroke-width="1.2" opacity=".55"/>
    <circle cx="17" cy="20" r="4" fill="#0d2b52" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="48" cy="52" r="4.5" fill="#2f86ff"/>
    <circle cx="210" cy="34" r="3.5" fill="#0d2b52" stroke="#60a5fa" stroke-width="1.4"/>
  </svg>
  <div class="sidebar-footer">
    <div class="caption">Instituições participantes</div>
    <img src="logo-instituicoes.png" alt="Fiocruz, UFMS, UFOPA, UFPI, UNILA, UNIR">
  </div>
</div>

<div id="main">
  <div class="topbar">
    <button id="menuToggle" aria-label="Abrir menu">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div style="flex:1;">
      <h1 id="pageTitle">Dashboard</h1>
      <p id="pageSubtitle">Visão geral da execução orçamentária da rede.</p>
    </div>
    
  </div>
  <div id="backdrop"></div>
  <div class="content" id="contentRoot"></div>
